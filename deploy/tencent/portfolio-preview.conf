# Internal-only verification before ICP approval. Do not change the listen
# address or bind the public domain until the filing and HTTPS are ready.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /var/www/4ndras-preview;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
